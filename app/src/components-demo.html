<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared components</title>
<style>/*__STYLES__*/
html,body{height:auto;overflow:auto}body{padding:60px 72px 72px}.gallery-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:42px}.gallery-head h1{font:72px 'AH English',monospace}.gallery-head button{background:none;color:var(--pink-soft);border:1px solid var(--line);padding:12px 24px;cursor:pointer}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:36px}.sample{border-top:2px solid var(--line);padding:24px 12px;min-height:420px;min-width:0}.sample h2{font:36px 'AH English',monospace;color:var(--pink-soft);margin:0 0 30px}.sample .ring{height:360px}.sample .ring .station{font-size:48px}.sample .stairs{min-height:340px}.sample .stairs>.stair{height:calc(80px + var(--level)*78px)}.sample .cmp th,.sample .cmp td{padding:18px;height:90px}.sample .card{width:100%;max-width:720px}.sample .card>img{height:240px}.sample .ph{height:250px}.sample .flow{margin-top:65px}
</style></head><body class="component-demo">
<header class="gallery-head"><h1>Shared components</h1><div><button onclick="demoStep(Math.max(0,Number(document.querySelector('#demo-step').textContent)-1))">←</button> <span id="demo-step">0</span> <button onclick="demoStep(Number(document.querySelector('#demo-step').textContent)+1)">→</button></div></header>
<main class="gallery">
<section class="sample"><h2>01 / info-list</h2><ul class="info-list"><li data-step="1"><span class="info">Loop</span><span class="secondary">接着干</span><small>发动机</small></li><li data-step="2"><span class="info">工具</span><span class="secondary">能动手</span><small>方向盘</small></li><li data-step="4"><span class="info">Skills</span><span class="secondary">会你这儿的做法</span><small>导航</small></li></ul></section>
<section class="sample"><h2>02 / flow</h2><div class="flow" data-closed data-token><div class="station info" data-step="1">看<small>主信息</small></div><div class="station info" data-step="2">想<small>次信息</small></div><div class="station info" data-step="3">做<small>Function calling</small></div></div></section>
<section class="sample"><h2>03 / ring</h2><div class="ring" data-token><div class="station info" data-step="1">看</div><div class="station info" data-step="2">想</div><div class="station info" data-step="3">做</div></div></section>
<section class="sample"><h2>04 / stairs</h2><div class="stairs"><div class="stair" data-state="dark">暗</div><div class="stair" data-state="gray">灰</div><div class="stair" data-state="bright">亮</div><div class="stair" data-state="current">当前</div></div></section>
<section class="sample"><h2>05 / cmp</h2><table class="cmp"><thead><tr><th>主信息</th><th>次信息</th></tr></thead><tbody><tr data-step="1" data-gray="4"><td>Loop</td><td data-fill="2">接着干</td></tr><tr data-step="2"><td>工具</td><td data-fill="3" data-pink="3">能动手</td></tr><tr data-step="3" data-flash="3"><td></td><td data-fill="4">讲师填写</td></tr></tbody></table></section>
<section class="sample"><h2>06 / card</h2><figure class="card" data-step="1"><img src="images/pi-demo-flow.webp" alt="Pi"><figcaption class="info">Pi</figcaption></figure></section>
<section class="sample"><h2>07 / ph</h2><div class="ph info" data-step="1">讲师截图</div></section>
<section class="sample"><h2>08 / links</h2><ul class="links"><li data-step="1"><a href="https://github.com/earendil-works/pi" target="_blank" rel="noopener noreferrer">Pi</a><span class="tag">GitHub</span></li><li data-step="4"><a href="https://www.anthropic.com/engineering/building-effective-agents" target="_blank" rel="noopener noreferrer">Building effective agents</a><span class="tag">原文</span></li></ul></section>
</main><script>/*__SCRIPT__*/</script></body></html>
